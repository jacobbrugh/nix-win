[project]
name = "staged-uv-tree"
version = "0.1.0"
description = "Assemble a Nix-built Python tool's runtime tree for native Windows execution."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
staged-uv-tree = "staged_uv_tree.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
staged_uv_tree = ["py.typed"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
